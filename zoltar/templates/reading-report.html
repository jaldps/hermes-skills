<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zoltar — {{TITLE}}</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Raleway:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap');

  :root {
    --accent: #c9a84c;
    --accent-light: #e8d5a3;
    --accent-alt: #4a2d6e;
    --accent-alt-light: #6b3fa0;
    --dark: #0a0a12;
    --dark2: #12121f;
    --dark3: #1a1a2e;
    --text: #d4cfc7;
    --text-light: #e8e4dc;
    --fire: #e25822;
    --water: #3a7bd5;
    --air: #a8c6df;
    --earth: #6b8e4e;
    --border: rgba(201,168,76,0.2);
  }

  /* COLOR SCHEME VARIANTS — uncomment one:
  Rose (feminine): --accent:#c95a7c; --accent-light:#e8a3b8; --accent-alt:#a04268; --accent-alt-light:#c95a7c;
  Gold (masculine): --accent:#c9a84c; --accent-light:#e8d5a3; --accent-alt:#4a2d6e; --accent-alt-light:#6b3fa0;
  Emerald (neutral): --accent:#4eca8b; --accent-light:#a3e8c6; --accent-alt:#2d6e4e; --accent-alt-light:#4eca8b;
  */

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--dark); color: var(--text); font-family: 'Raleway', sans-serif; font-weight: 400; line-height: 1.7; font-size: 15px; }
  .page { max-width: 900px; margin: 0 auto; padding: 40px 60px; }

  /* COVER */
  .cover { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; border-bottom: 1px solid var(--border); position: relative; overflow: hidden; }
  .cover::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(ellipse at center, rgba(74,45,110,0.15) 0%, transparent 60%), radial-gradient(ellipse at 30% 20%, rgba(201,168,76,0.08) 0%, transparent 50%); }
  .cover-symbol { font-size: 80px; margin-bottom: 30px; opacity: 0.6; position: relative; }
  .cover h1 { font-family: 'Cinzel', serif; font-size: 42px; font-weight: 700; color: var(--accent); letter-spacing: 6px; text-transform: uppercase; position: relative; }
  .cover h2 { font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 400; font-style: italic; color: var(--text-light); margin-top: 12px; letter-spacing: 2px; }
  .cover .subject { margin-top: 50px; padding: 20px 40px; border: 1px solid var(--border); border-radius: 2px; }
  .cover .subject h3 { font-family: 'Cinzel', serif; font-size: 22px; color: var(--accent-light); letter-spacing: 4px; }
  .cover .subject p { font-family: 'Raleway', sans-serif; font-size: 14px; color: var(--text); margin-top: 8px; letter-spacing: 1px; }
  .cover .date { margin-top: 60px; font-size: 12px; letter-spacing: 3px; color: rgba(201,168,76,0.5); text-transform: uppercase; }

  /* SECTIONS */
  .section { padding: 60px 0; border-bottom: 1px solid var(--border); }
  .section:last-child { border-bottom: none; }
  .section-header { display: flex; align-items: center; gap: 16px; margin-bottom: 40px; }
  .section-icon { font-size: 32px; width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--border); border-radius: 50%; background: rgba(74,45,110,0.15); }
  .section-title { font-family: 'Cinzel', serif; font-size: 28px; font-weight: 600; color: var(--accent); letter-spacing: 3px; text-transform: uppercase; }
  .section-subtitle { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 16px; color: rgba(201,168,76,0.6); margin-top: 2px; }

  /* CARDS & BOXES */
  .ascendant-box { background: linear-gradient(135deg, rgba(74,45,110,0.2), rgba(201,168,76,0.08)); border: 1px solid var(--border); border-radius: 4px; padding: 24px 30px; margin-bottom: 36px; }
  .ascendant-box h3 { font-family: 'Cinzel', serif; font-size: 18px; color: var(--accent-light); letter-spacing: 2px; margin-bottom: 8px; }
  .ascendant-box p { font-family: 'Cormorant Garamond', serif; font-size: 17px; line-height: 1.8; color: var(--text-light); }

  .planet-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 36px; }
  .planet-card { background: var(--dark2); border: 1px solid var(--border); border-radius: 4px; padding: 18px 22px; transition: border-color 0.3s; }
  .planet-card:hover { border-color: var(--accent); }
  .planet-card .planet-name { font-family: 'Cinzel', serif; font-size: 14px; color: var(--accent); letter-spacing: 2px; text-transform: uppercase; }
  .planet-card .planet-pos { font-family: 'Cormorant Garamond', serif; font-size: 16px; color: var(--text-light); margin-top: 4px; }
  .planet-card .planet-house { font-size: 12px; color: rgba(201,168,76,0.5); letter-spacing: 1px; margin-top: 2px; }
  .planet-card .planet-interp { font-size: 13px; color: var(--text); margin-top: 8px; line-height: 1.6; }

  .element-bar { display: flex; gap: 8px; margin: 20px 0; height: 8px; border-radius: 4px; overflow: hidden; }
  .element-bar div { height: 100%; border-radius: 4px; }
  .el-fire { background: var(--fire); } .el-water { background: var(--water); } .el-air { background: var(--air); } .el-earth { background: var(--earth); }
  .element-legend { display: flex; gap: 24px; margin-bottom: 20px; flex-wrap: wrap; }
  .element-legend span { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text); }
  .element-legend .dot { width: 8px; height: 8px; border-radius: 50%; }

  .horoscope-box { background: linear-gradient(135deg, rgba(201,168,76,0.06), rgba(74,45,110,0.12)); border: 1px solid var(--border); border-radius: 4px; padding: 30px 36px; margin-bottom: 24px; }
  .horoscope-box .sign-badge { display: inline-block; font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: 3px; color: var(--accent); border: 1px solid var(--accent); padding: 4px 14px; border-radius: 2px; margin-bottom: 16px; text-transform: uppercase; }
  .horoscope-box .horoscope-text { font-family: 'Cormorant Garamond', serif; font-size: 18px; font-style: italic; line-height: 1.9; color: var(--text-light); }
  .horoscope-commentary { padding: 20px 0; font-size: 14px; line-height: 1.8; color: var(--text); border-left: 2px solid var(--accent); padding-left: 20px; margin-top: 16px; }

  .num-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 36px; }
  .num-card { background: var(--dark2); border: 1px solid var(--border); border-radius: 4px; padding: 22px; text-align: center; transition: border-color 0.3s; }
  .num-card:hover { border-color: var(--accent); }
  .num-card .num-label { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: rgba(201,168,76,0.6); margin-bottom: 8px; }
  .num-card .num-value { font-family: 'Cinzel', serif; font-size: 36px; font-weight: 700; color: var(--accent); line-height: 1; }
  .num-card .num-meaning { font-family: 'Cormorant Garamond', serif; font-size: 14px; color: var(--text); margin-top: 10px; line-height: 1.5; }

  .pinnacle-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
  .pinnacle-table th { font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); text-align: left; padding: 10px 16px; border-bottom: 1px solid var(--border); }
  .pinnacle-table td { padding: 12px 16px; font-size: 14px; border-bottom: 1px solid rgba(201,168,76,0.08); color: var(--text); }
  .pinnacle-table tr.current td { background: rgba(201,168,76,0.05); color: var(--accent-light); font-weight: 500; }
  .pinnacle-table .num-cell { font-family: 'Cinzel', serif; font-size: 20px; font-weight: 700; color: var(--accent); }

  .tarot-spread { display: flex; gap: 24px; justify-content: center; margin: 30px 0; }
  .tarot-card { flex: 1; max-width: 260px; background: linear-gradient(180deg, var(--dark3) 0%, var(--dark2) 100%); border: 1px solid var(--border); border-radius: 8px; padding: 28px 22px; text-align: center; position: relative; overflow: hidden; }
  .tarot-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, transparent, var(--accent), transparent); }
  .tarot-card .position-label { font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: rgba(201,168,76,0.5); margin-bottom: 16px; }
  .tarot-card .card-name { font-family: 'Cinzel', serif; font-size: 16px; color: var(--accent-light); letter-spacing: 1px; margin-bottom: 4px; }
  .tarot-card .card-orientation { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 12px; }
  .tarot-card .card-orientation.upright { color: var(--accent); }
  .tarot-card .card-orientation.rev { color: var(--accent-alt-light); }
  .tarot-card .card-element { font-size: 12px; color: rgba(201,168,76,0.4); margin-bottom: 12px; }
  .tarot-card .card-meaning { font-family: 'Cormorant Garamond', serif; font-size: 15px; color: var(--text); line-height: 1.6; font-style: italic; }

  .rune-spread { display: flex; gap: 24px; justify-content: center; margin: 30px 0; }
  .rune-card { flex: 1; max-width: 260px; background: linear-gradient(180deg, rgba(74,45,110,0.1) 0%, var(--dark2) 100%); border: 1px solid var(--border); border-radius: 8px; padding: 28px 22px; text-align: center; }
  .rune-card .rune-position { font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: rgba(201,168,76,0.5); margin-bottom: 12px; }
  .rune-card .rune-glyph { font-size: 48px; margin: 8px 0; color: var(--accent); line-height: 1; }
  .rune-card .rune-name { font-family: 'Cinzel', serif; font-size: 16px; color: var(--accent-light); letter-spacing: 1px; margin-bottom: 4px; }
  .rune-card .rune-meaning-label { font-size: 12px; color: rgba(201,168,76,0.5); margin-bottom: 10px; }
  .rune-card .rune-meaning-text { font-family: 'Cormorant Garamond', serif; font-size: 14px; color: var(--text); line-height: 1.5; font-style: italic; }
  .rune-card .rune-poem { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); font-family: 'Cormorant Garamond', serif; font-size: 13px; font-style: italic; color: rgba(201,168,76,0.5); line-height: 1.6; }

  .tarot-interp { margin-top: 20px; padding: 20px 0; }
  .tarot-interp h4 { font-family: 'Cinzel', serif; font-size: 14px; color: var(--accent); letter-spacing: 1px; margin-bottom: 8px; }
  .tarot-interp p { font-size: 14px; line-height: 1.7; color: var(--text); }

  .synthesis-box { background: linear-gradient(135deg, rgba(74,45,110,0.2), rgba(201,168,76,0.08)); border: 1px solid var(--border); border-radius: 4px; padding: 36px 40px; margin-top: 20px; }
  .synthesis-box p { font-family: 'Cormorant Garamond', serif; font-size: 17px; line-height: 2; color: var(--text-light); }
  .synthesis-box .highlight { color: var(--accent); font-weight: 600; }

  .footer { text-align: center; padding: 40px 0; border-top: 1px solid var(--border); margin-top: 20px; }
  .footer p { font-size: 11px; letter-spacing: 2px; color: rgba(201,168,76,0.3); text-transform: uppercase; }

  /* PRINT */
  @media print {
    body { background: #fff; color: #1a1a1a; }
    .page { padding: 20px 40px; }
    .cover { min-height: auto; padding: 60px 0; page-break-after: always; }
    .section { page-break-inside: avoid; }
    .cover::before { display: none; }
    .planet-card, .num-card, .tarot-card, .rune-card { border-color: #ccc; background: #f8f8f8; }
    .horoscope-box, .ascendant-box, .synthesis-box { border-color: #ccc; background: #f8f8f6; }
    :root { --accent: #8a6d2b; --accent-light: #a08540; --dark: #fff; --dark2: #f8f8f8; --dark3: #f0f0f0; --accent-alt: #6b3fa0; --accent-alt-light: #7b4fb0; --text: #333; --text-light: #222; --border: rgba(0,0,0,0.12); }
  }
  @page { size: A4; margin: 15mm; }
</style>
</head>
<body>

<!-- {{SECTIONS}} -->
<!-- {{FOOTER}} -->

</body>
</html>
